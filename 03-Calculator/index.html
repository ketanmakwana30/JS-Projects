<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Calculator</h1>
    <div class="calc">
      <div class="display">
        <input id="display" autofocus type="text" />
      </div>
      <div class="keys">
        <div class="key">AC</div>
        <div class="key">%</div>
        <div class="key">/</div>
        <div class="key">⌫</div>
        <div class="key">7</div>
        <div class="key">8</div>
        <div class="key">9</div>
        <div class="key">*</div>
        <div class="key">4</div>
        <div class="key">5</div>
        <div class="key">6</div>
        <div class="key">-</div>
        <div class="key">1</div>
        <div class="key">2</div>
        <div class="key">3</div>
        <div class="key">+</div>
        <div class="key">00</div>
        <div class="key">0</div>
        <div class="key equal">=</div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
