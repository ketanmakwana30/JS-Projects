<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Word Counter Tool</h1>
        <p id="p">Pest or type your text below.</p>
        <textarea  id="text" placeholder="Type here!"></textarea>
        <div class="stats">
            <div class="stat-boxs">Letters<span id="letter-count"></span></div>
            <div class="stat-boxs">Words<span id="word-count"></span></div>
            <div class="stat-boxs">Sentences<span id="sentence-count"></span></div>
            <div class="stat-boxs">Read timing<span id="time"></span></div>
        </div>
        <button id="clearBtn">Clear</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
