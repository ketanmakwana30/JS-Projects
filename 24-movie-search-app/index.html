<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search and explore movies using the OMDb API."
    />
    <title>Movie Search App</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  
  <body>
    <header class="header">
      <div class="container">
        <h1 class="logo">🎬 Movie Search</h1>
        <form id="searchForm" class="search-form">
          <label for="searchInput" class="sr-only"> Search for a movie </label>

          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Search movies..."
            autocomplete="off"
          />

          <button type="submit" id="searchButton" class="search-button">
            Search
          </button>
        </form>
      </div>
    </header>

    <main class="main">
      <div class="container"> 
        <div id="status" class="status" role="status" aria-live="polite"></div>

        <section
          id="movieContainer"
          class="movie-container"
          aria-label="Movie search results"
        ></section>

        <nav
          id="pagination"
          class="pagination"
          aria-label="Movie pagination"
        ></nav>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>Movie Search App &copy; 2026</p>

        <p>Powered by OMDb API</p>
      </div>
    </footer>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
