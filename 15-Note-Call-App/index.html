<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Note App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Side Controls -->
        <div class="side-controls">
            <button class="ctrl-btn" id="add-note" title="Add card">+</button>
            <button class="ctrl-btn" id="upBtn" title="Previous">↑</button>
            <button class="ctrl-btn" id="downBtn" title="Next">↓</button>
        </div>

        <!-- Cards Stack -->
        <div class="card-wrapper">
            <!-- empty state sits INSIDE wrapper so layout stays centered -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">📋</div>
                <p>No cards yet.<br>Click <strong>+</strong> to add one.</p>
            </div>
            <div class="stack" id="stack"></div>
        </div>

    </div>

    <!-- Modal Overlay -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <h2>New Card</h2>
            <form id="card-form">

                <div class="field">
                    <label for="fImg">Image URL</label>
                    <input type="text" id="fImg" placeholder="https://i.pravatar.cc/150">
                </div>

                <div class="field">
                    <label for="fName">Full Name</label>
                    <input type="text" id="fName" placeholder="Enter full name">
                </div>

                <div class="field">
                    <label for="fTown">Home Town</label>
                    <input type="text" id="fTown" placeholder="Enter home town">
                </div>

                <div class="field">
                    <label for="fPurpose">Purpose</label>
                    <input type="text" id="fPurpose" placeholder="e.g., Quick appointment">
                </div>

                <div class="field">
                    <label>Category</label>
                    <div class="cats">
                        <div class="cat-pill emergency" data-cat="Emergency">
                            <span class="pill-check"></span> Emergency
                        </div>
                        <div class="cat-pill important" data-cat="Important">
                            <span class="pill-check"></span> Important
                        </div>
                        <div class="cat-pill urgent" data-cat="Urgent">
                            <span class="pill-check"></span> Urgent
                        </div>
                        <div class="cat-pill norush" data-cat="No Rush">
                            <span class="pill-check"></span> No Rush
                        </div>
                    </div>
                </div>

                <button type="submit" class="create-note-btn">Create Card</button>
                <button type="button" class="close-form">Cancel</button>

            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
