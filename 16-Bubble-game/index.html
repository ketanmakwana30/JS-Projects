<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <div id="panel">
            <div id="ptop">
                <div class="elem">
                    <h2>Hit</h2>
                    <div class="box">1 : 00</div>
                </div>
                <div class="elem">
                    <h2>Timer</h2>
                    <div class="box">7</div>
                </div>
                <div class="elem">
                    <h2>Score</h2>
                    <div class="box">8</div>
                </div>
                
            </div>

            <div id="pbtm">
                <div class="bubble">1</div>
            </div>
        </div>
    </div>





    <script src="app.js"></script>
</body>
</html>
